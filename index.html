<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Peluquería</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>ELEVATE</h1>
    <nav>
      <a href="#servicios">Servicios</a>
      <a href="#reserva">Reservar</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <section class="hero">
    <a href="#reserva" class="btn">Reservar turno</a>

    <button id="compartirApp" class="share-btn">
        <i class="fa-solid fa-share-nodes"></i>
    </button>

    <h3 class="share-title">COMPARTÍ NUESTRA APP</h3>
    <p class="share-subtitle">Descargá gratis</p>
</section>

  <section id="servicios" class="servicios">
    <h2>Servicios</h2>
    <div class="cards">
      <div class="card"><i class="fa-solid fa-scissors"></i><h3>Corte</h3></div>
      <div class="card"><i class="fa-solid fa-brush"></i><h3>Color</h3></div>
      <div class="card"><i class="fa-solid fa-person"></i><h3>Peinado</h3></div>
    </div>
  </section>

  <section id="reserva" class="reserva">
    <h2>Reservá tu turno</h2>
    <form id="formReserva">
      <input type="text" id="nombre" placeholder="Tu nombre" required>
      <input type="text" id="servicio" placeholder="Servicio (ej: corte, color...)" required>
      <input type="text" id="hora" placeholder="Horario deseado" required>
      <button type="submit">Enviar por WhatsApp</button>
    </form>
  </section>

  <section id="contacto" class="contacto">
    <h2>Contacto</h2>
    <p><i class="fa-brands fa-whatsapp"></i> <a href="https://wa.me/5493765372920" target="_blank">+54 9 376 537-2920</a></p>
    <p><i class="fa-brands fa-facebook"></i> <a href="https://www.facebook.com/profile.php?id=100079765767729" target="_blank">Facebook</a></p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d221.4638122405533!2d-55.90308280000001!3d-27.36256459999999!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9457bf027fff4bc7%3A0x9a43a21d44c2f676!2sOPEN%20SOCIETY%20FOUNDATIONS!5e0!3m2!1ses!2sar!4v1762232199548!5m2!1ses!2sar"
      allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>

<footer class="footer">
    © 2026 Todos los derechos reservados.
    <br>
    Desarrollado por Matías Andino.
</footer>
 
</body>
</html>
